services:
  - type: web
    name: medi-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python setup_db.py
    startCommand: gunicorn src.wsgi:application --bind 0.0.0.0:8000 --workers 1 --timeout 120 --access-logfile - --error-logfile -
    envVars:
      - key: ENV
        value: prod
      - key: DJANGO_SETTINGS_MODULE
        value: src.settings.prod
      - key: PYTHON_VERSION
        value: 3.11.0
