services:
  - type: web
    name: medi-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: gunicorn src.wsgi:application --config gunicorn_config.py
    envVars:
      - key: ENV
        value: prod
      - key: DJANGO_SETTINGS_MODULE
        value: src.settings.prod
      - key: PYTHON_VERSION
        value: 3.11.0
